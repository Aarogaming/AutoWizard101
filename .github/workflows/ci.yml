name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ProjectMaelstrom/ProjectMaelstrom.sln

      - name: Build
        run: dotnet build ProjectMaelstrom/ProjectMaelstrom.sln -c Debug --no-restore

      - name: Test
        run: dotnet test ProjectMaelstrom/ProjectMaelstrom.sln -c Debug --no-build --verbosity normal

      - name: Toolkit selftest
        run: dotnet run --project MaelstromToolkit/MaelstromToolkit.csproj -- selftest

  python-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bare runner Python: optional vision/audio stacks (NumPy, Pillow, OpenCV)
      # are absent, so the guarded suites skip instead of erroring.
      - name: Project board gate
        run: python tools/check_project_board.py --allow-missing-local --strict-claims

      - name: Claim evidence gate
        run: python tools/check_claim_evidence.py --strict

      - name: Text encoding gate
        run: python tools/check_text_encoding.py --quiet

      - name: Python tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

  rust-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust tests
        run: cargo test --workspace --locked

  node-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node tests
        working-directory: integrations/node-red
        run: node --test

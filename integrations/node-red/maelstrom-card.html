<script type="text/html" data-template-name="maelstrom-card">
<p><b>Card back · configuration</b></p>
<div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name"></div>

<script type="text/html" data-help-name="maelstrom-card">
<p>Topics: card/preview, card/save, card/load, card/deal. The configured native card JSON is used for preview/save/deal; Load uses the saved ID. Output is a card view with native card, front and back. Deal updates the native deck without starting it. Execution/replay is a separate explicit step through the existing owner.</p>
<p>No arbitrary scripts or new action bindings. Unknown facts are rejected; unavailable producers remain visible requirements and cannot become invented readings. Catalog validation is preliminary; native deal remains authoritative. The current back uses JSON configuration; a graphical flip-card editor is future work.</p>
</script>

[package]
name = "maelstrom-fallback"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
maelstrom-core = { path = "../maelstrom-core" }
flate2 = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
